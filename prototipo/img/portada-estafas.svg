<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Teléfono que recibe un mensaje con un enlace sospechoso, entre una señal de peligro y un escudo de protección">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#23477f"/>
    </linearGradient>
  </defs>
  <rect width="360" height="220" rx="18" fill="url(#fondo)"/>
  <circle cx="300" cy="30" r="60" fill="#ffffff" opacity=".05"/>
  <circle cx="40" cy="200" r="70" fill="#ffffff" opacity=".05"/>
  <!-- carretera -->
  <path d="M0 196 C90 186 270 186 360 196 V220 H0z" fill="#06142a" opacity=".55"/>
  <path d="M40 204 h30 M110 201 h30 M190 200 h30 M270 202 h30" stroke="#f0b020" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- teléfono -->
  <rect x="128" y="18" width="104" height="176" rx="16" fill="#ffffff"/>
  <rect x="136" y="34" width="88" height="146" rx="6" fill="#e8f0fb"/>
  <rect x="166" y="24" width="28" height="4" rx="2" fill="#c3c9d6"/>
  <!-- encabezado del chat -->
  <rect x="136" y="34" width="88" height="20" rx="6" fill="#16305a"/>
  <circle cx="148" cy="44" r="5" fill="#c3c9d6"/>
  <rect x="157" y="41" width="40" height="6" rx="3" fill="#ffffff" opacity=".8"/>
  <!-- burbuja 1 -->
  <rect x="142" y="62" width="70" height="30" rx="8" fill="#ffffff"/>
  <rect x="149" y="69" width="54" height="5" rx="2.5" fill="#9aa6bb"/>
  <rect x="149" y="79" width="38" height="5" rx="2.5" fill="#9aa6bb"/>
  <!-- burbuja 2 con enlace -->
  <rect x="142" y="100" width="76" height="40" rx="8" fill="#ffffff"/>
  <rect x="149" y="107" width="60" height="5" rx="2.5" fill="#9aa6bb"/>
  <rect x="149" y="118" width="56" height="5" rx="2.5" fill="#2a78d6"/>
  <rect x="149" y="125" width="34" height="2" fill="#2a78d6"/>
  <circle cx="216" cy="102" r="10" fill="#d03b3b"/>
  <rect x="214.5" y="96" width="3" height="8" rx="1.5" fill="#ffffff"/>
  <circle cx="216" cy="107.5" r="1.8" fill="#ffffff"/>
  <!-- botón falso -->
  <rect x="150" y="150" width="60" height="18" rx="9" fill="#d03b3b" opacity=".9"/>
  <rect x="162" y="157" width="36" height="4" rx="2" fill="#ffffff"/>
  <!-- señal de peligro -->
  <path d="M62 78 L102 148 H22 Z" fill="#f0b020" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <rect x="58.5" y="102" width="7" height="26" rx="3.5" fill="#0b1d3a"/>
  <circle cx="62" cy="137" r="4.5" fill="#0b1d3a"/>
  <!-- escudo -->
  <path d="M298 74 l34 13 v24 c0 22 -15 35 -34 41 c-19 -6 -34 -19 -34 -41 v-24 z" fill="#0f8a2e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M283 112 l10 10 l20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
