<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="Historia en tres pasos: llega un mensaje falso, Luis se detiene a pensar, revisa en la aplicación oficial y comprueba que no había ningún aviso">
  <rect width="360" height="150" rx="16" fill="#e8f0fb"/>
  <!-- Panel 1: llega el mensaje -->
  <rect x="10" y="10" width="104" height="104" rx="12" fill="#ffffff"/>
  <rect x="42" y="22" width="40" height="72" rx="8" fill="#0b1d3a"/>
  <rect x="46" y="30" width="32" height="56" rx="3" fill="#e8f0fb"/>
  <rect x="49" y="38" width="26" height="14" rx="4" fill="#ffffff"/>
  <rect x="52" y="42" width="18" height="3" rx="1.5" fill="#9aa6bb"/>
  <rect x="52" y="47" width="12" height="3" rx="1.5" fill="#2a78d6"/>
  <circle cx="80" cy="30" r="9" fill="#d03b3b"/>
  <rect x="78.6" y="24.5" width="2.8" height="7" rx="1.4" fill="#ffffff"/>
  <circle cx="80" cy="34.6" r="1.6" fill="#ffffff"/>
  <!-- Panel 2: se detiene -->
  <rect x="128" y="10" width="104" height="104" rx="12" fill="#ffffff"/>
  <circle cx="180" cy="44" r="16" fill="#f0b020"/>
  <circle cx="174" cy="42" r="2" fill="#0b1d3a"/>
  <circle cx="186" cy="42" r="2" fill="#0b1d3a"/>
  <path d="M174 52 h12" fill="none" stroke="#0b1d3a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M158 104 q22 -40 44 0 z" fill="#16305a"/>
  <path d="M202 18 a8 8 0 1 1 8 8 v5" fill="none" stroke="#16305a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="210" cy="37" r="2.2" fill="#16305a"/>
  <!-- pausa: se detiene antes de tocar el enlace -->
  <circle cx="148" cy="80" r="11" fill="#f0b020"/>
  <rect x="143.5" y="74" width="3.5" height="12" rx="1.2" fill="#0b1d3a"/>
  <rect x="149" y="74" width="3.5" height="12" rx="1.2" fill="#0b1d3a"/>
  <!-- Panel 3: verifica en la app oficial -->
  <rect x="246" y="10" width="104" height="104" rx="12" fill="#ffffff"/>
  <rect x="278" y="22" width="40" height="72" rx="8" fill="#0b1d3a"/>
  <rect x="282" y="30" width="32" height="56" rx="3" fill="#e5f5e9"/>
  <path d="M298 38 l12 5 v8 c0 8 -5 12 -12 14 c-7 -2 -12 -6 -12 -14 v-8 z" fill="#0f8a2e"/>
  <path d="M292 51 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="287" y="72" width="22" height="4" rx="2" fill="#0f8a2e" opacity=".6"/>
  <!-- flechas -->
  <path d="M116 62 h10 M122 58 l4 4 l-4 4" fill="none" stroke="#16305a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M234 62 h10 M240 58 l4 4 l-4 4" fill="none" stroke="#16305a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- números -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0b1d3a">
    <circle cx="62" cy="132" r="11" fill="#f0b020"/><text x="62" y="136.5">1</text>
    <circle cx="180" cy="132" r="11" fill="#f0b020"/><text x="180" y="136.5">2</text>
    <circle cx="298" cy="132" r="11" fill="#f0b020"/><text x="298" y="136.5">3</text>
  </g>
</svg>
